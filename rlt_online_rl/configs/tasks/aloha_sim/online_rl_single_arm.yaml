experiment:
  rl:
    action_dim: 7
    chunk_len: 10
    z_dim: 2048
    proprio_dim: 7
    gamma: 0.99
    fixed_std: 0.05
    reference_dropout_prob: 0.5
    warmup_bc_weight: 1.0
    warmup_q_weight: 1.0
    online_bc_weight: 1.0
    online_q_weight: 1.0
    delta_weight: 0.0
    actor_hidden_dim: 256
    actor_num_layers: 2
    critic_hidden_dim: 256
    critic_num_layers: 2
    actor_lr: 0.0003
    critic_lr: 0.0003
    target_tau: 0.005
    actor_update_period: 2
    warmup_min_size: 2
    warmup_post_collect_updates: 2
    freeze_after_warmup: false
    grad_updates_per_cycle: 1
runtime:
  role: all
  local_debug_mode: false
  actor_service:
    bind_host: 127.0.0.1
    port: 9201
    snapshot_path: ./runs/online_rl/aloha-single-arm-smoke/actor_snapshot/actor_snapshot.pkl
    xla_mem_fraction: 0.08
    xla_preallocate: false
  learner_service:
    replay_url: http://127.0.0.1:9202
    checkpoint_dir: ./runs/online_rl/aloha-single-arm-smoke/checkpoints
    actor_snapshot_path: ./runs/online_rl/aloha-single-arm-smoke/actor_snapshot/actor_snapshot.pkl
    sample_batch_size: 2
    checkpoint_interval_steps: 2
    push_actor_interval_steps: 1
    xla_mem_fraction: 0.20
    xla_preallocate: false
  replay:
    bind_host: 127.0.0.1
    port: 9202
    capacity: 20000
    journal_path: ./runs/online_rl/aloha-single-arm-smoke/replay/replay_journal.pkl
  env_driver:
    machine_a_ws_url: ws://127.0.0.1:8000
    actor_service_url: http://127.0.0.1:9201
    replay_service_url: http://127.0.0.1:9202
    episode_start_control_mode: policy
    chunk_exec_horizon: 10
    control_frequency_hz: 50.0
    step_trace_stride: 0
    replay_feature_batch_size: 16
    safe_fallback_to_ref: true
    machine_a_connect_timeout_sec: 10.0
    machine_a_recv_timeout_sec: 10.0
    machine_a_retry_interval_sec: 0.5
    replay_request_timeout_sec: 30.0
